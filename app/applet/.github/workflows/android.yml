name: Android CI/CD Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-apk:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Temurin JDK 17 with Gradle caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Grant execution permission to Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4: Prepare environment variables (.env)
      - name: Prepare build environment
        run: |
          # The Secrets plugin requires a .env file.
          # If a GitHub Secret 'ENV_FILE' exists, use it. Otherwise, fallback to .env.example.
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # Step 5: Setup headless JVM and universal keystore
      - name: Force Headless Environment & Generate Debug Keystore
        run: |
          # Prevent AWT event dispatching errors during KSP/Roborazzi tasks
          echo "org.gradle.jvmargs=-Djava.awt.headless=true" >> gradle.properties
          
          # Generate a universal debug keystore on the runner
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Step 6: Assemble the Debug APK using injected signing keys
      - name: Build Debug APK
        run: >
          ./gradlew assembleDebug 
          -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" 
          -Pandroid.injected.signing.store.password="android" 
          -Pandroid.injected.signing.key.alias="androiddebugkey" 
          -Pandroid.injected.signing.key.password="android" 
          --stacktrace

      # Step 7: Upload the compiled APK as a workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
